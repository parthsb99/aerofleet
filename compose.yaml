# ==============================================================================
# AeroFleet Vehicle Service Management Platform - Docker Compose Configuration
# ==============================================================================
# Services:
#   1. database: MongoDB 7.0 persistent database
#   2. backend:  Node.js Express REST API + Socket.IO server
#   3. frontend: Production SPA served via Nginx with WebSocket reverse proxy
# ==============================================================================

name: aerofleet

services:
  # ── 1. Database (MongoDB) ──────────────────────────────────────────────────
  database:
    image: mongo:7.0
    container_name: aerofleet-database
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: vsa_db
    volumes:
      # Named persistent volume ensures data survives container rebuilds/restarts
      - aerofleet-mongodb-data:/data/db
    networks:
      - aerofleet-network
    # Port 27017 is not published to host by default for database security
    # Uncomment next line only if direct host GUI access (e.g. Compass) is needed:
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 2. Backend (Node.js Express + Socket.IO) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerofleet-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://database:27017/vsa_db
      JWT_SECRET: ${JWT_SECRET:-aerofleet_super_secure_production_jwt_secret_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost,http://localhost:80,http://127.0.0.1:5173}
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Direct port mapping for REST APIs & direct WebSocket connections
      - "5001:5001"
    networks:
      - aerofleet-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:5001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. Frontend (Vite React + Nginx Reverse Proxy) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerofleet-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Port 5173 preserves familiar dev port; Port 80 allows standard web access
      - "5173:80"
      - "80:80"
    networks:
      - aerofleet-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  aerofleet-network:
    driver: bridge
    name: aerofleet-network

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  aerofleet-mongodb-data:
    name: aerofleet-mongodb-data
