# ==============================================================================
# AeroFleet – All-in-One Single Service Render Blueprint (render.yaml)
# ==============================================================================
# Deploys BOTH Frontend & Backend together as a single unified service on Render!
#
# • Frontend: Vite React SPA (built during render-build and served statically)
# • Backend: Node.js Express REST API + Socket.IO WebSockets on the same port
# • No CORS issues, no separate service syncing, no multi-platform headache!
# ==============================================================================

services:
  - type: web
    name: aerofleet
    runtime: node
    plan: free
    region: oregon          # Options: oregon, frankfurt, singapore, ohio
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MONGO_URI: Your MongoDB Atlas connection string (set in Render Dashboard)
      - key: MONGO_URI
        sync: false
      # JWT_SECRET: Render auto-generates a secure random 64-char key
      - key: JWT_SECRET
        generateValue: true
